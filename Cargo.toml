[package]
name = "rclonedash"
version = "0.1.0"
edition = "2021"
authors = ["Lucas Martinati"]
description = "Terminal User Interface (TUI) élégante et réactive pour surveiller rclone bisync"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1.11"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

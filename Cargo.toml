[package]
name = "rclonedash"
version = "1.0.2"
edition = "2021"
authors = ["Lucas Martinati"]
license = "MIT"
description = "Terminal User Interface (TUI) élégante et réactive pour surveiller rclone bisync"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1.11"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "Lucas Martinati <lucasm54800@gmail.com>"
copyright = "2026 Lucas Martinati"
license-file = []
extended-description = """\
Interactive, blazing fast TUI and monitoring dashboard for rclone bisync."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/rclonedash", "usr/bin/rclonedash", "755"],
    ["install.sh", "usr/bin/rclonedash-setup", "755"],
    ["services/rclone-bisync-guard.sh.template", "usr/share/rclonedash/rclone-bisync-guard.sh.template", "644"],
    ["services/rclone-bisync.service.template", "usr/share/rclonedash/rclone-bisync.service.template", "644"],
    ["services/rclone-bisync.timer", "usr/share/rclonedash/rclone-bisync.timer", "644"],
    ["services/gdrive-filters.txt", "usr/share/rclonedash/gdrive-filters.txt", "644"],
    ["README.md", "usr/share/doc/rclonedash/README.md", "644"],
]


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="50%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Sync Arrows Gradient 1 (Cyan to Blue) -->
    <linearGradient id="arrowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Sync Arrows Gradient 2 (Emerald to Mint) -->
    <linearGradient id="arrowGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cloud Fill Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cdd6f4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#shadow)"/>

  <!-- Subtle Inner Grid / Matrix Pattern -->
  <g opacity="0.07" stroke="#89b4fa" stroke-width="1.5">
    <line x1="80" y1="120" x2="432" y2="120"/>
    <line x1="80" y1="180" x2="432" y2="180"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="300" x2="432" y2="300"/>
    <line x1="80" y1="360" x2="432" y2="360"/>
    <line x1="140" y1="80" x2="140" y2="432"/>
    <line x1="200" y1="80" x2="200" y2="432"/>
    <line x1="260" y1="80" x2="260" y2="432"/>
    <line x1="320" y1="80" x2="320" y2="432"/>
    <line x1="380" y1="80" x2="380" y2="432"/>
  </g>

  <!-- Bisync Circular Orbit Track (Dotted Glow) -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#313244" stroke-width="8" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Upper Sync Arrow (Clockwise, Local -> Cloud) -->
  <g filter="url(#glow)">
    <path d="M 150 210 A 136 136 0 0 1 362 170" fill="none" stroke="url(#arrowCyan)" stroke-width="26" stroke-linecap="round"/>
    <polygon points="362,130 404,180 348,206" fill="#00f2fe"/>
  </g>

  <!-- Lower Sync Arrow (Counter-Clockwise, Cloud -> Local) -->
  <g filter="url(#glow)">
    <path d="M 362 302 A 136 136 0 0 1 150 342" fill="none" stroke="url(#arrowGreen)" stroke-width="26" stroke-linecap="round"/>
    <polygon points="150,382 108,332 164,306" fill="#a6e3a1"/>
  </g>

  <!-- Central Cloud Shape -->
  <g filter="url(#shadow)">
    <path d="M 216 270 
             L 300 270 
             A 30 30 0 0 0 324 220 
             A 46 46 0 0 0 252 184 
             A 38 38 0 0 0 196 226 
             A 32 32 0 0 0 216 270 Z" 
          fill="url(#cloudGrad)"/>
  </g>

  <!-- Terminal Chevron & Underscore inside the Cloud (Rclone / CLI identity) -->
  <path d="M 234 226 L 248 238 L 234 250" fill="none" stroke="#181825" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="250" x2="274" y2="250" stroke="#181825" stroke-width="5" stroke-linecap="round"/>

  <!-- Subtle bottom activity pulse dot -->
  <circle cx="256" cy="414" r="7" fill="#00f2fe" opacity="0.9"/>
  <circle cx="256" cy="414" r="14" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.5"/>
</svg>

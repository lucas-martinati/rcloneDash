<svg width="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Logo RcloneDash</title>
  <desc>Double flèche de synchronisation bidirectionnelle rouge lumineuse sans fond.</desc>
  <defs>
    <!-- Dégradé rouge vif et éclatant pour la synchronisation -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#e62525"/>
      <stop offset="100%" stop-color="#9e1313"/>
    </linearGradient>

    <!-- Halo lumineux subtil pour faire ressortir l'icône sur fonds clairs ou sombres -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#ff3b3b" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Double flèche de synchronisation bidirectionnelle (bisync) sans fond -->
  <g filter="url(#glow)">
    <path d="M 30.00 120.00 A 90 90 0 0 1 177.85 51.06" fill="none" stroke="url(#redGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210.00 120.00 A 90 90 0 0 1 62.15 188.94" fill="none" stroke="url(#redGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="191.06,26.79 210.03,78.08 157.65,66.65" fill="#ff5252"/>
    <polygon points="48.94,213.21 29.97,161.92 82.35,173.35" fill="#ff5252"/>
  </g>
</svg>
<svg width="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Logo RcloneDash</title>
  <desc>Badge terminal arrondi avec trois points de fenêtre et icône de synchronisation circulaire rouge lumineuse.</desc>
  <defs>
    <!-- Dégradé de fond graphite profond avec contraste élevé -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28292e"/>
      <stop offset="100%" stop-color="#131315"/>
    </linearGradient>

    <!-- Dégradé rouge vif et éclatant pour la synchronisation -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#e62525"/>
      <stop offset="100%" stop-color="#9e1313"/>
    </linearGradient>

    <!-- Halo lumineux subtil pour faire ressortir l'icône sur les docks sombres -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e62525" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Cadre terminal plein format : bordures transparentes réduites à 3px -->
  <rect x="3" y="3" width="234" height="234" rx="48" fill="url(#bg)" stroke="#ff3b47" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Trois points de fenêtre de terminal rouges -->
  <circle cx="38" cy="38" r="6.5" fill="#ff5252"/>
  <circle cx="60" cy="38" r="6.5" fill="#c41d1d"/>
  <circle cx="82" cy="38" r="6.5" fill="#851212"/>

  <!-- Flèche de synchronisation circulaire haute lisibilité -->
  <g filter="url(#glow)">
    <path d="M 74 116 A 58 58 0 1 1 166 178" fill="none" stroke="url(#redGrad)" stroke-width="12" stroke-linecap="round"/>
    <polygon points="142,204 182,190 156,164" fill="#ff5252"/>
  </g>
</svg>
<svg width="100%" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>Logo RcloneDash</title>
  <desc>Badge terminal arrondi avec double flèche de synchronisation bidirectionnelle rouge lumineuse.</desc>
  <defs>
    <!-- Dégradé de fond graphite profond -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28292e"/>
      <stop offset="100%" stop-color="#131315"/>
    </linearGradient>

    <!-- Dégradé rouge vif et éclatant pour la synchronisation -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#e62525"/>
      <stop offset="100%" stop-color="#9e1313"/>
    </linearGradient>

    <!-- Halo lumineux pour faire ressortir l'icône sur les docks sombres -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#ff3b3b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Cadre plein format avec bordure très fine de 2.5px -->
  <rect x="3" y="3" width="234" height="234" rx="50" fill="url(#bg)" stroke="#ff3b47" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Double flèche de synchronisation bidirectionnelle (bisync) centrée et épaissie (stroke 28px) -->
  <g filter="url(#glow)">
    <path d="M 44.00 120.00 A 76 76 0 0 1 168.85 61.78" fill="none" stroke="url(#redGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 196.00 120.00 A 76 76 0 0 1 71.15 178.22" fill="none" stroke="url(#redGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="180.45,40.18 197.96,86.21 149.59,76.95" fill="#ff5252"/>
    <polygon points="59.55,199.82 42.04,153.79 90.41,163.05" fill="#ff5252"/>
  </g>
</svg>